<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA · Design review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9eef1;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#20302c;height:100dvh;display:flex;flex-direction:column}header{padding:12px 20px;background:white;border-bottom:1px solid #dfe6e8;display:flex;align-items:center;gap:14px;flex-wrap:wrap}h1{font-size:15px;font-weight:600;margin:0}header>span{font-size:11px;color:#66756f}select,button,a{font:12px inherit;padding:9px 12px;border:1px solid #dfe6e8;background:white;border-radius:8px;color:#20302c;text-decoration:none;cursor:pointer}select{max-width:290px}button:hover,a:hover{background:#e6f2ed}.spacer{flex:1}.stage{flex:1;display:flex;justify-content:center;padding:14px;min-height:0}iframe{border:1px solid #dfe6e8;border-radius:14px;width:100%;height:100%;background:#f6f8fa;transition:width .25s}.note{font-size:11px;margin:0 20px 10px;color:#586964}body.mobile iframe{width:375px;max-width:100%}label{font-size:11px;display:flex;gap:8px;align-items:center}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #5e9d8b;outline-offset:2px}@media(max-width:650px){header{gap:8px;padding:10px}.stage{padding:5px}header>span{display:none}}
</style></head><body>
<header><h1>nexora <span style="font-weight:400;color:#7b8b84">/ design review</span></h1><span>32 screens · Synthetic data</span><span class="spacer"></span><label>Screen <select id="screen"></select></label><button id="size" onclick="setSize()" aria-pressed="false">375 px mobile</button><button onclick="theme()">Light / dark</button><a href="/?demo" target="_blank" rel="noopener">Open workspace ↗</a></header>
<div class="stage"><iframe id="preview" title="NEXORA interactive design preview" src="/?demo"></iframe></div>
<p class="note">Demo records are fictional and reset on reload. Login preview: demo / demo. Use the app navigation to explore submodules. This review runs through dev-server.py.</p>
<script>
const groups={
'Workspace':[['home','Overview'],['login','Login'],['module','Module menu']],
'QA Inspection':[['weight','Weight log'],['samplelist','List samples'],['seal','Seal bags'],['temp','Temperatures'],['gmp','GMP audit'],['metal','Metal detector'],['capa','CAPA'],['hold','Hold cases'],['shift','Shift report']],
'Laboratory':[['analysis','Sample analysis'],['yeast','Yeast & mold'],['lab','Lab samples'],['grilling','Grilling cheese'],['raw','Raw analysis'],['dry','Dry 1935'],['formag','Formag'],['rd','R&D']],
'Production':[['production','Production schedule']],
'Products':[['products','Product catalog'],['addproduct','Create product'],['customers','Customers']],
'COA':[['coa','COA generator'],['coastatus','COA status'],['labresults','Lab results']],
'Review & administration':[['dashboard','Analytics dashboard'],['reports','Reports'],['lotsearch','Search'],['activity','Activity log'],['admin','Users & roles']]};
const select=document.querySelector('#screen');
Object.entries(groups).forEach(([name,items])=>{let g=document.createElement('optgroup');g.label=name;items.forEach(([id,label])=>{let o=document.createElement('option');o.value=id;o.textContent=label;g.append(o)});select.append(g)});
select.addEventListener('change',()=>{let id=select.value,w=document.querySelector('#preview').contentWindow;if(id==='login'){document.querySelector('#preview').src='/?demo&login';return}if(!w.currentUser){document.querySelector('#preview').src='/?demo&pantalla='+encodeURIComponent(id);return}if(id==='module')w.selectModule('qa');else w.goTo('screen-'+id)});
function setSize(){const on=document.body.classList.toggle('mobile');document.querySelector('#size').setAttribute('aria-pressed',on);document.querySelector('#size').textContent=on?'Full desktop':'375 px mobile'}
function theme(){const w=document.querySelector('#preview').contentWindow;if(w.toggleDarkMode)w.toggleDarkMode()}
</script></body></html>
